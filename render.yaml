services:
  - type: web
    name: two-truths-one-lie
    runtime: node
    plan: free
    # Build-time tools (TypeScript, Tailwind, PostCSS) live in devDependencies,
    # so force them to install even if NODE_ENV is set to production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    # State is kept in memory, so this MUST stay at a single instance.
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
